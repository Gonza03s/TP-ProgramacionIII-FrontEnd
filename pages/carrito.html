<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/styless.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
    <script src="../js/carrito.js" defer></script>
    <title>Carrito</title>
  </head>
  <body>
    
    <header>
      <div class="header-container">
        <div class="logo-container">
          <img src="../assets/img/logo.png" alt="logo-farmacia" />
        </div>

        <div class="nav-container">
          <nav>
            <ul>
              <li><a href="productos.html">Productos</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main>

      <section id="table-section">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Eliminar</th>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
              </tr>
            </thead>

            <tbody id="cuerpo-tabla"></tbody>
          </table>
        </div>
      </section>


      <section>
        <div class="total-container">
          <h3>Monto total carrito</h3>
          <div id="montoTotal"></div>
        </div>
      </section>
      
      <section>
        <div class="buttons-container">

          <div class="btn-container-ticket">
            <button id="btn-ticket" type="button">Imprimir Ticket</button>
          </div>
          
          <div class="btn-container-excel">
            <button id="btn-excel" type="button">Exportar Excel</button>
          </div>

        </div>

      </section>

    </main>
  </body>
</html>
